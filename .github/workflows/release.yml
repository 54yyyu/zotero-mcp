name: Build and publish to PyPI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    tags:
    - '*'
    branches:
    - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # PDF text extraction is a compiled dependency shipping per-platform
        # abi3 wheels, so Linux alone cannot tell us the package installs and
        # parses correctly everywhere. One job per other OS is enough to catch
        # a missing wheel or a platform-specific extraction failure.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout "fastmcp<4" pyzotero python-dotenv "pdf-inspector==0.2.6" markdownify chromadb unidecode bibtexparser tiktoken pymupdf
          python -m pip install -e . --no-deps
      - name: Run tests
        run: pytest --ignore=tests/test_lifespan.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Build the Zotero Agent plugin
        run: |
          npm ci
          npm run build
          mkdir -p ../src/zotero_mcp/chat_plugin
          cp dist/zotero-agent.xpi ../src/zotero_mcp/chat_plugin/
        working-directory: plugin
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      # Not in dist/: the PyPI upload step takes everything there.
      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: plugin/dist/zotero-agent.xpi

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/zotero-mcp-server/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xpi
      - name: Attach the plugin to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" zotero-agent.xpi --clobber

  publish-registry:
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write   # required for mcp-publisher's GitHub OIDC login
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Sync server.json version to the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json
      - name: Wait for the release to appear on PyPI
        # The registry verifies that the referenced version actually exists on PyPI,
        # and the index can lag a few seconds behind the upload in the previous job.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/zotero-mcp-server/$VERSION/json" > /dev/null; then
              echo "zotero-mcp-server $VERSION is live on PyPI"
              exit 0
            fi
            echo "attempt $i: not on PyPI yet, retrying in 10s"
            sleep 10
          done
          echo "zotero-mcp-server $VERSION never appeared on PyPI"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Publish to the MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

