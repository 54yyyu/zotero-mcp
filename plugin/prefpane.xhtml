<!-- Zotero Chat's pane in Zotero's Settings: prefpane.js hands this element to the plugin, which draws the panel's own
     settings screen into it. The search strings let Zotero's settings search find the pane. -->
<html:div id="zmc-prefs" style="display: block; min-width: 0;"
  data-search-strings-raw="Chat,Agent,Claude Code,Codex,pi,Model,Effort,Permissions,API key,Subscription,Appearance,Glass,Accent,Background,Text size,Density,Context,Prompts,Shortcuts,Chat folder,History"/>
